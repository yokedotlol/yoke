name: "Scoring Dispute"
description: Your overall score, axis score, or tier assignment doesn't match what you'd expect.
title: "[Scoring] "
labels: ["scoring", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Score doesn't seem right

        This is for broader scoring concerns — not individual signal detection issues (use the detection templates for those). Use this if the composite score, axis score, tier, or percentile ranking feels wrong given your site's actual configuration.

  - type: input
    id: domain
    attributes:
      label: Domain scanned
      placeholder: "example.com"
    validations:
      required: true

  - type: input
    id: reported-score
    attributes:
      label: Score Yoke assigned
      description: The composite score and/or axis scores shown.
      placeholder: "Composite: 72 (Moderate). Security: 85, Speed: 60, Foundations: 68"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected and why
      description: What score or tier did you expect, and what's your reasoning?
      placeholder: |
        I expected Strong (78+) because:
        - HTTPS with HSTS and valid cert
        - HTTP/2 enabled
        - CDN (Cloudflare) in front
        - All major security headers present
        - Clean DNS setup
    validations:
      required: true

  - type: dropdown
    id: axis-concern
    attributes:
      label: Which axis is most surprising?
      options:
        - Composite / overall score
        - Security
        - Speed
        - Foundations
        - Reputation
        - Discoverability
        - Email
      default: 0
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Comparison to similar sites, specific deductions you disagree with, etc.
    validations:
      required: false
