name: "Scan Error or Failure"
description: Your domain scan failed, timed out, returned an error, or produced incomplete results.
title: "[Scan] Error: "
labels: ["bug", "scan-failure", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Scan didn't complete or produced an error

        Use this template for technical issues with the scanning process itself — timeouts, rate limits, errors, or incomplete results.

  - type: input
    id: domain
    attributes:
      label: Domain you tried to scan
      placeholder: "example.com"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: What happened?
      options:
        - Scan timed out
        - Got an error message
        - Scan completed but results look incomplete
        - Rate limited
        - Infinite loading / never completed
        - API returned an error (using yoke.lol API directly)
        - Other
    validations:
      required: true

  - type: textarea
    id: error-details
    attributes:
      label: Error message or details
      description: Copy any error message shown, or describe what you saw.
      placeholder: "Error: Analysis timed out after 30s"
      render: shell
    validations:
      required: false

  - type: input
    id: timestamp
    attributes:
      label: Approximate time of the scan
      description: When did you try the scan? Include timezone.
      placeholder: "2026-06-02 3:00 PM PST"
    validations:
      required: false

  - type: dropdown
    id: method
    attributes:
      label: How did you scan?
      options:
        - yoke.lol website
        - Yoke API (curl / programmatic)
        - Yoke CLI
        - Chrome Extension
      default: 0
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Browser, device, network conditions, anything else relevant.
    validations:
      required: false
