name: Release CLI

on:
  push:
    tags:
      - 'cli/v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#cli/}" >> "$GITHUB_OUTPUT"

      - name: Create semver tag for GoReleaser
        run: git tag "${{ steps.version.outputs.tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with repo write access to yokedotlol/homebrew-tap
          # Create at: https://github.com/settings/tokens → Fine-grained → yokedotlol/homebrew-tap → Contents: Read+Write
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
