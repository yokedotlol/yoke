name: CI + Deploy (Worker)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'client/**'
      - 'tests/**'
      - 'prompts/**'
      - '*.lock'
      - 'package.json'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'
      - 'biome.json'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'client/**'
      - 'tests/**'
      - 'prompts/**'
      - '*.lock'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd client && bun install --frozen-lockfile && cd ..
          cd worker && bun install --frozen-lockfile && cd ..

      - name: Audit dependencies for known vulnerabilities
        working-directory: client
        run: bun pm ls --all 2>/dev/null | head -50
        continue-on-error: true

      - name: Check for suspicious install scripts in dependencies
        working-directory: client
        run: |
          echo "Checking for preinstall/postinstall scripts in dependencies..."
          SUSPICIOUS=$(find node_modules -maxdepth 3 -name "package.json" -exec grep -l '"preinstall"\|"postinstall"' {} \; 2>/dev/null || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "::warning::Found packages with install scripts:"
            echo "$SUSPICIOUS"
          else
            echo "✓ No suspicious install scripts found"
          fi

      - name: Type check (worker)
        working-directory: worker
        run: bun run typecheck

      - name: Type check (client)
        working-directory: client
        run: bun run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build client
        working-directory: client
        run: bun run build.ts

      - name: Build worker
        working-directory: worker
        run: bun run build

      - name: Check worker bundle size
        run: |
          SIZE=$(wc -c < worker/dist/worker.js)
          SIZE_KB=$((SIZE / 1024))
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Worker bundle: ${SIZE_KB} KB (${SIZE} bytes)"
          if [ "$SIZE" -gt 10485760 ]; then
            echo "::error::Worker bundle exceeds 10 MB CF limit (${SIZE_MB} MB)"
            exit 1
          elif [ "$SIZE" -gt 5242880 ]; then
            echo "::warning::Worker bundle exceeds 5 MB (${SIZE_MB} MB) — approaching CF limit"
          else
            echo "✓ Bundle size OK"
          fi

      - name: Lint (Biome)
        run: npx @biomejs/biome check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd client && bun install --frozen-lockfile && cd ..
          cd worker && bun install --frozen-lockfile && cd ..

      - name: Build client
        working-directory: client
        run: bun run build.ts

      - name: Build worker
        working-directory: worker
        run: bun run build

      - name: Generate wrangler.toml
        working-directory: worker
        env:
          D1_STATS_DB_ID: ${{ secrets.D1_STATS_DB_ID }}
          KV_REFERENCE_DATA_ID: ${{ secrets.KV_REFERENCE_DATA_ID }}
        run: |
          cat > wrangler.toml << EOF
          name = "yoke"
          main = "dist/worker.js"
          compatibility_date = "2026-05-31"

          [vars]
          BASE_URL = "https://yoke.lol"

          [assets]
          directory = "../client/dist"
          binding = "ASSETS"
          run_worker = "always"

          [[d1_databases]]
          binding = "STATS_DB"
          database_name = "yoke-stats"
          database_id = "${D1_STATS_DB_ID}"

          [[kv_namespaces]]
          binding = "REFERENCE_DATA"
          id = "${KV_REFERENCE_DATA_ID}"

          [[routes]]
          pattern = "yoke.lol/*"
          zone_name = "yoke.lol"

          [[routes]]
          pattern = "mta-sts.yoke.lol/*"
          zone_name = "yoke.lol"

          [[durable_objects.bindings]]
          name = "RATE_LIMITER"
          class_name = "RateLimiterDO"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["RateLimiterDO"]

          [triggers]
          crons = ["0 */1 * * *"]
          EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' wrangler.toml

      - name: Deploy to Cloudflare Workers
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install worker dependencies (for wrangler rollback)
        run: |
          cd worker && bun install && cd ..

      - name: Smoke tests (with retry)
        env:
          CF_SMOKE_SECRET: ${{ secrets.CF_SMOKE_SECRET }}
        run: |
          # Smoke tests use a bypass header so Cloudflare Bot Fight Mode
          # doesn't challenge GitHub Actions runner IPs with JS challenges.
          # Set CF_SMOKE_SECRET as a GitHub repo secret AND create a matching
          # Cloudflare WAF custom rule to skip managed challenge when
          # X-Smoke-Test header matches the secret value.
          SMOKE_HEADER=""
          if [ -n "$CF_SMOKE_SECRET" ]; then
            SMOKE_HEADER="-H X-Smoke-Test:${CF_SMOKE_SECRET}"
            echo "Using smoke test bypass header"
          else
            echo "::warning::CF_SMOKE_SECRET not set — smoke tests may fail due to Cloudflare Bot Fight Mode"
          fi

          # Retry helper: retries a command up to N times with backoff
          retry() {
            local max=$1 delay=$2 desc=$3
            shift 3
            for attempt in $(seq 1 "$max"); do
              if "$@" 2>/dev/null; then
                echo "✓ $desc (attempt $attempt)"
                return 0
              fi
              if [ "$attempt" -lt "$max" ]; then
                echo "  ⟳ $desc — attempt $attempt/$max failed, retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            echo "::error::$desc — failed after $max attempts"
            echo "=== DIAGNOSTIC ==="
            curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 10 $SMOKE_HEADER https://yoke.lol/
            echo ""
            curl -s --max-time 10 $SMOKE_HEADER https://yoke.lol/ | head -c 300
            echo ""
            echo "=== END ==="
            return 1
          }

          echo "Waiting for edge propagation..."
          # 1. HTML homepage — wait longest here since it's the first check after deploy
          retry 6 10 "HTML homepage" bash -c \
            "curl -sf --max-time 15 $SMOKE_HEADER https://yoke.lol/ | grep -q '<title>'"

          # 2. Version header
          retry 3 5 "X-Yoke-Version header" bash -c "
            VERSION=\$(curl -sI --max-time 10 $SMOKE_HEADER https://yoke.lol/api/docs | grep -i x-yoke-version | awk '{print \$2}' | tr -d '\r')
            [ -n \"\$VERSION\" ] && echo \"\$VERSION\" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' && echo \"Deployed: \$VERSION\"
          "

          # 3. API docs
          retry 3 5 "API docs" bash -c \
            "curl -sf --max-time 15 $SMOKE_HEADER https://yoke.lol/api/docs | grep -qi 'api'"

          # 4. JSON API (longer timeout — runs a real analysis)
          retry 3 10 "JSON API (example.com)" bash -c \
            "curl -sf --max-time 90 $SMOKE_HEADER -H 'Accept: application/json' 'https://yoke.lol/example.com' | jq -e '.domain' > /dev/null"

          # 5. Status page
          retry 3 5 "Status page" bash -c \
            "curl -sf --max-time 15 $SMOKE_HEADER https://yoke.lol/status | grep -qi 'status'"

          echo ""
          echo "All smoke tests passed ✅"

      # ── Rollback on failure ──────────────────────────────────────
      - name: Generate wrangler.toml (for rollback)
        if: failure()
        working-directory: worker
        env:
          D1_STATS_DB_ID: ${{ secrets.D1_STATS_DB_ID }}
          KV_REFERENCE_DATA_ID: ${{ secrets.KV_REFERENCE_DATA_ID }}
        run: |
          cat > wrangler.toml << EOF
          name = "yoke"
          main = "dist/worker.js"
          compatibility_date = "2026-05-31"

          [vars]
          BASE_URL = "https://yoke.lol"

          [assets]
          directory = "../client/dist"
          binding = "ASSETS"
          run_worker = "always"

          [[d1_databases]]
          binding = "STATS_DB"
          database_name = "yoke-stats"
          database_id = "${D1_STATS_DB_ID}"

          [[kv_namespaces]]
          binding = "REFERENCE_DATA"
          id = "${KV_REFERENCE_DATA_ID}"

          [[routes]]
          pattern = "yoke.lol/*"
          zone_name = "yoke.lol"

          [[routes]]
          pattern = "mta-sts.yoke.lol/*"
          zone_name = "yoke.lol"

          [[durable_objects.bindings]]
          name = "RATE_LIMITER"
          class_name = "RateLimiterDO"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["RateLimiterDO"]

          [triggers]
          crons = ["0 */1 * * *"]
          EOF
          sed -i 's/^          //' wrangler.toml

      - name: 🚨 Rollback deployment
        if: failure()
        working-directory: worker
        run: |
          echo "::error::Smoke tests failed — rolling back to previous deployment"
          echo "y" | npx wrangler rollback --message "Automatic rollback: smoke tests failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
