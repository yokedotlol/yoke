name: Seed KV Reference Data

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which data to seed'
        required: true
        type: choice
        options:
          - all
          - retire-js
      reason:
        description: 'Reason for manual run'
        required: false
        type: string
  schedule:
    # Weekly Sunday 08:00 UTC (midnight PST)
    - cron: '0 8 * * 0'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install worker dependencies
        run: cd worker && bun install --frozen-lockfile

      - name: Generate wrangler.toml
        working-directory: worker
        env:
          D1_STATS_DB_ID: ${{ secrets.D1_STATS_DB_ID }}
          KV_REFERENCE_DATA_ID: ${{ secrets.KV_REFERENCE_DATA_ID }}
        run: |
          cat > wrangler.toml << TOML
          name = "yoke"
          main = "dist/worker.js"
          compatibility_date = "2026-05-31"

          [vars]
          BASE_URL = "https://yoke.lol"

          [[kv_namespaces]]
          binding = "REFERENCE_DATA"
          id = "${KV_REFERENCE_DATA_ID}"
          TOML
          sed -i 's/^          //' wrangler.toml

      - name: Seed KV data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          case "$TARGET" in
            retire-js) bash scripts/seed-kv.sh --retire-js ;;
            all)       bash scripts/seed-kv.sh --all ;;
          esac
