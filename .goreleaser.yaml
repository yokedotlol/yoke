# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: yoke

before:
  hooks:
    - bash -c "cd cli && go mod tidy"

builds:
  - id: yoke
    dir: cli
    main: .
    binary: yoke
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: yokedotlol
    name: yoke
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

# NB: GoReleaser v2.10+ deprecated `brews` in favor of `homebrew_casks`, but
# casks are macOS-only. We build for Linux too, so we keep `brews` (still works,
# just emits a deprecation warning). Revisit if GoReleaser drops `brews` entirely
# or if Homebrew casks gain Linux support.
brews:
  - name: yoke
    repository:
      owner: yokedotlol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://yoke.lol
    description: "Domain intelligence in one pass — DNS, WHOIS, SSL, security, tech stack, performance, breaches, and AI analysis"
    license: MIT
    install: |
      bin.install "yoke"
    test: |
      assert_match version.to_s, shell_output("#{bin}/yoke --version")
